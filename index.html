<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#07070c" />
    <title>AURA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-screen="intro">
    <canvas id="aura"></canvas>

    <section class="screen is-on" data-screen="intro" id="screen-intro">
      <img class="logo" src="assets/aura_logo.svg" alt="aura" />
    </section>

    <section class="screen" data-screen="consent" id="screen-consent">
      <div class="panel">
        <img class="logo logo-sm" src="assets/aura_logo.svg" alt="aura" />
        <p>
          AURA peut utiliser des cookies pour le fonctionnement du service et,
          plus tard, pour mesurer l’audience.
        </p>
        <div class="actions">
          <button type="button" class="btn-primary" id="btn-accept">
            Accepter
          </button>
          <button type="button" class="btn-ghost" id="btn-refuse">
            Refuser
          </button>
        </div>
      </div>
    </section>

    <section class="screen" data-screen="configure" id="screen-configure">
      <div class="configure">
        <h1>Ton aura</h1>
        <p class="lede">Choisis ton univers</p>

        <h2>Palette</h2>
        <div class="choice-row" id="palette-list"></div>

        <h2>Glow</h2>
        <div class="choice-row" id="glow-list"></div>

        <button type="button" class="btn-primary btn-wide" id="btn-create">
          Créer mon aura
        </button>
      </div>
    </section>

    <section class="screen" data-screen="processing" id="screen-processing">
      <div class="panel quiet">
        <img class="logo logo-sm" src="assets/aura_logo.svg" alt="aura" />
      </div>
    </section>

    <section class="screen" data-screen="result" id="screen-result">
      <div class="result">
        <h1>Ton aura</h1>
        <video id="result-video" controls playsinline></video>
        <a class="btn-primary" id="btn-download">Télécharger</a>
        <button type="button" class="btn-ghost" id="btn-new-aura">
          Nouvelle aura
        </button>
      </div>
    </section>

    <div id="create-controls" hidden>
      <button type="button" class="ctrl" id="btn-stop" hidden aria-label="Stop">
        <img src="assets/aura_stop.svg" alt="" />
      </button>
      <button type="button" class="ctrl ctrl-main" id="btn-play" aria-label="Play">
        <img src="assets/aura_play.svg" alt="" />
      </button>
      <button type="button" class="ctrl ctrl-main" id="btn-pause" hidden aria-label="Pause">
        <img src="assets/aura_pause.svg" alt="" />
      </button>
    </div>

    <div id="gate-desktop" class="gate" hidden>
      <img class="logo" src="assets/aura_logo.svg" alt="aura" />
      <p>AURA est une expérience conçue pour ton téléphone.</p>
      <p class="lede">Ouvre AURA sur ton mobile.</p>
    </div>

    <div id="gate-rotate" class="gate" hidden>
      <img class="logo logo-sm" src="assets/aura_logo.svg" alt="aura" />
      <p>Tourne ton téléphone en portrait</p>
    </div>

    <script src="palettes.js"></script>
    <script src="app.js"></script>
    <script src="record.js"></script>
    <script src="flow.js"></script>
  </body>
</html>
