<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#07070c" />
    <title>aura</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-screen="intro">
    <div id="stage">
    <canvas id="aura"></canvas>

    <section class="screen is-on" data-screen="intro" id="screen-intro">
      <div class="intro-glow" aria-hidden="true"></div>
      <img class="logo" src="assets/aura_logo.svg" alt="aura" />
      <button type="button" class="btn-primary" id="btn-enter">
        créer une aura
      </button>
    </section>

    <section class="screen" data-screen="consent" id="screen-consent">
      <div class="panel">
        <img class="logo logo-sm" src="assets/aura_logo.svg" alt="aura" />
        <p>
          aura peut utiliser des cookies pour le fonctionnement du service et,
          plus tard, pour mesurer l’audience.
        </p>
        <div class="actions">
          <button type="button" class="btn-primary" id="btn-accept">
            accepter
          </button>
          <button type="button" class="btn-ghost" id="btn-refuse">
            refuser
          </button>
        </div>
      </div>
    </section>

    <section class="screen" data-screen="configure" id="screen-configure">
      <div class="configure">
        <h1>ton aura</h1>
        <p class="lede">choisis ton ambiance.</p>

        <h2>palette</h2>
        <div class="choice-row" id="palette-list"></div>

        <h2>glow</h2>
        <div class="choice-row" id="glow-list"></div>

        <h2>ambiance</h2>
        <div class="mood-row" id="mood-list"></div>

        <button type="button" class="btn-primary btn-wide" id="btn-create">
          créer mon aura
        </button>
      </div>
    </section>

    <section class="screen" data-screen="processing" id="screen-processing">
      <div class="panel quiet">
        <img class="logo logo-sm" src="assets/aura_logo.svg" alt="aura" />
      </div>
    </section>

    <section class="screen" data-screen="result" id="screen-result">
      <div class="result">
        <h1>aura</h1>
        <p class="result-name" id="result-name"></p>
        <div class="result-frame" id="result-frame">
          <video id="result-video" playsinline webkit-playsinline muted loop></video>
          <img id="result-still" alt="" hidden>
        </div>
        <p class="result-meta" id="result-meta"></p>
        <p class="result-meta result-meta-sub" id="result-meta-sub"></p>
        <div id="result-moments" hidden>
          <h2>moments</h2>
          <div id="result-moments-list"></div>
        </div>
        <div class="result-actions">
          <button type="button" class="btn-primary" id="btn-download-image" hidden>
            télécharger l’image
          </button>
          <button type="button" class="btn-ghost" id="btn-download-moments" hidden>
            télécharger les 3
          </button>
          <a class="btn-ghost" id="btn-download">télécharger la vidéo</a>
          <button type="button" class="btn-ghost" id="btn-new-aura">
            nouvelle aura
          </button>
        </div>
      </div>
    </section>

    <div id="create-controls" hidden>
      <div id="record-timer" hidden>00:00</div>
      <div class="create-controls-row">
      <button type="button" class="ctrl" id="btn-stop" hidden aria-label="stop">
        <img src="assets/aura_stop.svg" alt="" />
      </button>
      <div class="ctrl-main-slot">
        <button type="button" class="ctrl ctrl-main" id="btn-play" aria-label="play">
          <img src="assets/aura_play.svg" alt="" />
        </button>
        <button type="button" class="ctrl ctrl-main" id="btn-pause" hidden aria-label="pause">
          <img src="assets/aura_pause.svg" alt="" />
        </button>
      </div>
      </div>
    </div>
    <div id="pause-edit" hidden>
      <div class="pause-edit-list" id="pause-palette-list" hidden></div>
      <div class="pause-edit-list" id="pause-glow-list" hidden></div>
      <div class="pause-edit-actions">
        <button type="button" class="pause-edit-toggle" id="btn-edit-palette">
          modifier la palette
          <span class="pause-edit-current" id="pause-palette-current">éclat</span>
        </button>
        <button type="button" class="pause-edit-toggle" id="btn-edit-glow">
          modifier le glow
          <span class="pause-edit-current" id="pause-glow-current">doux</span>
        </button>
      </div>
    </div>
    <button type="button" class="ctrl ctrl-back" id="btn-back-config" hidden aria-label="retour à la personnalisation">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="auraBackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F4C9D6" />
            <stop offset="100%" stop-color="#DCC9EF" />
          </linearGradient>
        </defs>
        <path
          fill="none"
          stroke="url(#auraBackGrad)"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M14.5 5.5 L7.5 12 L14.5 18.5"
        />
      </svg>
    </button>
    </div>

    <div id="gate-desktop" class="gate" hidden>
      <img class="logo" src="assets/aura_logo.svg" alt="aura" />
      <p>aura est une expérience conçue pour ton téléphone.</p>
    </div>

    <div id="gate-rotate" class="gate" hidden>
      <img class="logo logo-sm" src="assets/aura_logo.svg" alt="aura" />
      <p>tourne ton téléphone en portrait</p>
    </div>

    <script src="palettes.js"></script>
    <script src="app.js"></script>
    <script src="record.js"></script>
    <script src="signature.js"></script>
    <script src="flow.js"></script>
  </body>
</html>
